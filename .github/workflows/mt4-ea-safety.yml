name: MT4 EA source safety checks

on:
  push:
    paths:
      - "mt4/**"
      - "scripts/validate_mt4_ea.py"
      - ".github/workflows/mt4-ea-safety.yml"
  pull_request:
    paths:
      - "mt4/**"
      - "scripts/validate_mt4_ea.py"
      - ".github/workflows/mt4-ea-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run MT4 EA source safety checks
        run: python scripts/validate_mt4_ea.py
