name: Python app checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app.py backtest.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Streamlit startup smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py").run(timeout=30)
          if app.exception:
              for error in app.exception:
                  print(error.message)
              raise SystemExit("Streamlit app smoke test failed")
          assert any("ARC_SILK" in title.value for title in app.title), "Expected dashboard title was not rendered"
          print("Streamlit startup smoke test passed")
          PY
